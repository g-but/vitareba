allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  unrs-resolver: true

# pnpm refuses packages published within its minimum-release-age window — a
# supply-chain guard against a compromised release being installed before anyone
# notices. threadkit 0.1.0 was published from maonakamoto/threadkit minutes
# before this commit, so it needs an explicit exemption.
#
# This entry is temporary: once 0.1.0 is older than the window it is redundant
# and should be deleted. Add a new line only for a version we published
# ourselves — never to hurry along a third-party package, which is the exact
# situation the guard exists for.
minimumReleaseAgeExclude:
  - threadkit@0.1.0
  - "@bitbaum/mail-kit"
  - "@bitbaum/ai-kit@0.9.0"
